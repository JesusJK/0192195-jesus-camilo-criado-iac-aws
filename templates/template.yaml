AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Apache, Key Pair, CloudFormation y GitHub Actions - Nuevo Dashboard

Parameters:
  InstanceDescription:
    Description: Texto principal que se mostrara en la pagina web
    Type: String
    Default: Panel de Control de Infraestructura

  SecurityGroupDescription:
    Description: Descripcion del Security Group
    Type: String
    Default: Acceso HTTP y SSH al servidor

  KeyName:
    Description: Nombre de tu Key Pair existente en AWS para acceso SSH
    Type: AWS::EC2::KeyPair::KeyName

  LatestAmiId:
    Description: AMI mas reciente de Amazon Linux 2023 (se consulta automaticamente)
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  MyInstanceClase:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SecurityGroups:
        - !Ref ServerSecurityGroupClase
      Tags:
        - Key: Name
          Value: EC2-Clase-CF-Modern
        - Key: Proyecto
          Value: Class-CloudFormation
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          cat > /var/www/html/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Jesus Camilo Criado | Cloud Architecture</title>
            <style>
              :root {
                --bg-color: #0f172a;
                --card-bg: rgba(30, 41, 59, 0.7);
                --border-color: #334155;
                --primary: #38bdf8;
                --accent: #f59e0b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                background-color: var(--bg-color);
                background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                                  radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
              }
              .dashboard {
                width: 100%;
                max-width: 800px;
                background: var(--card-bg);
                backdrop-filter: blur(12px);
                border: 1px solid var(--border-color);
                border-radius: 20px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
                overflow: hidden;
              }
              .header {
                background: linear-gradient(135deg, #1e293b, #0f172a);
                padding: 30px 40px;
                border-bottom: 1px solid var(--border-color);
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
              }
              .badge {
                background: rgba(56, 189, 248, 0.15);
                color: var(--primary);
                border: 1px solid rgba(56, 189, 248, 0.3);
                padding: 6px 14px;
                font-size: 12px;
                font-weight: 600;
                border-radius: 30px;
                letter-spacing: 0.5px;
              }
              .title-area h1 {
                font-size: 24px;
                color: var(--text-main);
                margin-top: 8px;
              }
              .title-area p {
                color: var(--text-muted);
                font-size: 14px;
                margin-top: 4px;
              }
              .content {
                padding: 30px 40px;
              }
              .grid-cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
              }
              .info-card {
                background: rgba(15, 23, 42, 0.5);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                padding: 20px;
                transition: transform 0.2s ease, border-color 0.2s ease;
              }
              .info-card:hover {
                transform: translateY(-3px);
                border-color: var(--primary);
              }
              .info-card h3 {
                font-size: 13px;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 8px;
              }
              .info-card p {
                font-size: 16px;
                font-weight: 600;
                color: var(--primary);
              }
              .student-box {
                background: rgba(245, 158, 11, 0.05);
                border-left: 4px solid var(--accent);
                padding: 18px 20px;
                border-radius: 0 12px 12px 0;
                margin-bottom: 30px;
              }
              .student-box h4 {
                color: var(--accent);
                font-size: 16px;
                margin-bottom: 4px;
              }
              .student-box p {
                color: var(--text-muted);
                font-size: 14px;
                line-height: 1.5;
              }
              .footer {
                background: rgba(15, 23, 42, 0.3);
                padding: 20px 40px;
                border-top: 1px solid var(--border-color);
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
                font-size: 13px;
                color: var(--text-muted);
              }
              .footer a {
                color: var(--primary);
                text-decoration: none;
                font-weight: 500;
              }
              .footer a:hover {
                text-decoration: underline;
              }
            </style>
          </head>
          <body>
            <div class="dashboard">
              <div class="header">
                <div class="title-area">
                  <span class="badge">UFPSO · CLOUD COMPUTING</span>
                  <h1>${InstanceDescription}</h1>
                  <p>Infraestructura como Código (IaC) Desplegada con éxito</p>
                </div>
              </div>
              
              <div class="content">
                <div class="student-box">
                  <h4>Jesus Camilo Criado Ropero (Código: 0192195)</h4>
                  <p>Ingeniería de Sistemas · Universidad Francisco de Paula Santander Ocaña</p>
                </div>

                <div class="grid-cards">
                  <div class="info-card">
                    <h3>Orquestación</h3>
                    <p>AWS CloudFormation</p>
                  </div>
                  <div class="info-card">
                    <h3>Automatización</h3>
                    <p>GitHub Actions</p>
                  </div>
                  <div class="info-card">
                    <h3>Compute & Access</h3>
                    <p>EC2 (t3.micro) + Key Pair</p>
                  </div>
                </div>
              </div>

              <div class="footer">
                <span>Docente: Wilder Andrés Duarte Neira</span>
                <a href="https://github.com/JesusJK/0192195-jesus-camilo-criado-iac-aws.git" target="_blank">Ver Repositorio GitHub ↗</a>
              </div>
            </div>
          </body>
          </html>
          EOF

  ServerSecurityGroupClase:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      Tags:
        - Key: Name
          Value: SG-HTTP-SSH-Clase-CF-Modern
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyInstanceClase

  PublicIP:
    Description: IP publica de la instancia
    Value: !GetAtt MyInstanceClase.PublicIp

  WebsiteURL:
    Description: URL para abrir la pagina web
    Value: !Sub http://${MyInstanceClase.PublicIp}
