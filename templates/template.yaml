AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Apache creada desde GitHub Actions y CloudFormation

Parameters:
  InstanceDescription:
    Description: Texto principal que se mostrara en la pagina web
    Type: String
    Default: Servidor Web Apache

  SecurityGroupDescription:
    Description: Descripcion del Security Group
    Type: String
    Default: Acceso HTTP al servidor

  LatestAmiId:
    Description: AMI mas reciente de Amazon Linux 2023 (se consulta automaticamente)
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # Para recrear la instancia (y que User Data vuelva a correr) cambia este nombre,
  # por ejemplo a MyInstanceClaseV2, y actualizalo tambien en los Outputs.

  MyInstanceClase:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SecurityGroups:
        - !Ref ServerSecurityGroupClase
      Tags:
        - Key: Name
          Value: EC2-Clase-CF
        - Key: Proyecto
          Value: Class-CloudFormation
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y httpd
          systemctl enable --now httpd

          # Datos dinamicos de la instancia (IMDSv2)
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
          AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)

          # ---- Personaliza el HTML de aqui hacia abajo (hasta EOF) ----
          cat > /var/www/html/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Jesus | IaC AWS</title>
            <style>
              * { box-sizing: border-box; }
              body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
                     background: radial-gradient(circle at top left, #1b3a6b, #070b18 70%);
                     color: #e8eefc; min-height: 100vh; display: flex;
                     align-items: center; justify-content: center; padding: 24px; }
              .card { background: rgba(255,255,255,0.05); border: 1px solid #3b5a99;
                      border-radius: 20px; padding: 36px 44px; max-width: 760px; width: 100%;
                      box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
              .tag { display: inline-block; background: linear-gradient(90deg,#00d4ff,#7c5cff);
                     color: #fff; font-weight: 700; font-size: 12px; padding: 5px 12px;
                     border-radius: 20px; letter-spacing: 1px; }
              h1 { font-size: 34px; margin: 18px 0 4px; color: #ffffff; }
              h2 { font-weight: 400; color: #8fb4ff; margin: 0 0 22px; font-size: 18px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                      gap: 12px; margin: 22px 0; }
              .stat { background: rgba(0,212,255,0.08); border: 1px solid #2c4a80;
                      border-radius: 12px; padding: 14px; }
              .stat small { display: block; color: #8fb4ff; font-size: 11px;
                            text-transform: uppercase; letter-spacing: 1px; }
              .stat b { font-size: 15px; word-break: break-all; }
              .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
              .step { background: #7c5cff33; border: 1px solid #7c5cff; border-radius: 999px;
                      padding: 6px 14px; font-size: 13px; }
              a { color: #00d4ff; }
              footer { margin-top: 24px; font-size: 13px; color: #7f95bd; }
            </style>
          </head>
          <body>
            <div class="card">
              <span class="tag">CLOUD COMPUTING · UFPSO</span>
              <h1>${InstanceDescription} 🚀</h1>
              <h2>Infraestructura como código: GitHub → CloudFormation → AWS</h2>
              <p><strong>Jesus TU_APELLIDO</strong> · Código TU_CODIGO<br>
                 Ingeniería de Sistemas · Universidad Francisco de Paula Santander Ocaña</p>

              <div class="grid">
                <div class="stat"><small>Instancia</small><b>__INSTANCE_ID__</b></div>
                <div class="stat"><small>Zona</small><b>__AZ__</b></div>
                <div class="stat"><small>Región</small><b>${AWS::Region}</b></div>
                <div class="stat"><small>Stack</small><b>${AWS::StackName}</b></div>
              </div>

              <div class="steps">
                <span class="step">1. Push a GitHub</span>
                <span class="step">2. GitHub Actions</span>
                <span class="step">3. CloudFormation</span>
                <span class="step">4. EC2 + Apache</span>
              </div>

              <p>Esta página se publicó sin entrar al servidor: el repositorio describe la
                 infraestructura y GitHub Actions la crea automáticamente en AWS.</p>
              <p><a href="https://github.com/TU_USUARIO/TU_REPOSITORIO">Ver el repositorio del proyecto</a></p>
              <footer>Docente: Wilder Andrés Duarte Neira</footer>
            </div>
          </body>
          </html>
          EOF

          sed -i "s/__INSTANCE_ID__/$INSTANCE_ID/g; s/__AZ__/$AZ/g" /var/www/html/index.html
          systemctl restart httpd

  ServerSecurityGroupClase:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      Tags:
        - Key: Name
          Value: SG-HTTP-Clase-CF
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyInstanceClase

  PublicIP:
    Description: IP publica de la instancia
    Value: !GetAtt MyInstanceClase.PublicIp

  WebsiteURL:
    Description: URL para abrir la pagina web
    Value: !Sub http://${MyInstanceClase.PublicIp}
